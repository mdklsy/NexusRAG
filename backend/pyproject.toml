[project]
name = "nexusrag"
version = "0.1.0"
description = "NexusRAG - Open-source RAG + Knowledge Graph platform"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.25.0",
    "redis>=5.0",
    "qdrant-client>=1.9",
    "openai>=1.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "selectolax>=0.3.21",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "jieba>=0.42",
    "cryptography>=42.0",
    # sql_db 工具的同步驱动（introspect/execute 用 sync engine）：
    # SQLAlchemy 2.1 起 postgresql:// 默认走 psycopg(v3)，psycopg2 兼容显式 postgresql+psycopg2:// 写法；
    # MySQL 需 pymysql；SQLite 内置无需安装
    "psycopg[binary]>=3.2",
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "aiosqlite>=0.20",
]
rerank = [
    "sentence-transformers>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
