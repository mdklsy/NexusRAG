name: nexusrag

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexusrag
      POSTGRES_PASSWORD: nexusrag
      POSTGRES_DB: nexusrag
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusrag"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      ENV: prod
      SECRET_KEY: ${SECRET_KEY:-please-change-me}
      DATABASE_URL: postgresql+asyncpg://nexusrag:nexusrag@postgres:5432/nexusrag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LLM_API_BASE: ${LLM_API_BASE}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      RERANK_API_BASE: ${RERANK_API_BASE:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nexusrag.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    command: >
      sh -c "alembic upgrade head &&
             python -m app.bootstrap &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
    environment:
      ENV: prod
      SECRET_KEY: ${SECRET_KEY:-please-change-me}
      DATABASE_URL: postgresql+asyncpg://nexusrag:nexusrag@postgres:5432/nexusrag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      LLM_API_BASE: ${LLM_API_BASE}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      RERANK_API_BASE: ${RERANK_API_BASE:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    command: python -m app.workers.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # 留空 = 前端走相对路径 /api/v1/...，由 nginx 同源代理（填 /api 会拼成 /api/api 双前缀）
        VITE_API_BASE: ""
    depends_on:
      - api
    ports:
      - "3001:80"

volumes:
  pg_data:
  qdrant_data:
  redis_data:
  uploads:
